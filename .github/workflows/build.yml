name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (core + typecheck)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Git identity for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: cargo test -p strand-core

  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            bundles: app,dmg
          - name: Windows x64
            os: windows-latest
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      - name: Collect files (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p out
          cp target/release/bundle/dmg/*.dmg out/
          ls -la out

      - name: Collect files (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p out
          cp target/release/bundle/nsis/*.exe out/
          cp target/release/bundle/msi/*.msi out/
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cp target/release/strand.exe "out/Strand_${version}_x64_portable.exe"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: strand-${{ runner.os == 'macOS' && 'macos-arm64' || 'windows-x64' }}
          path: out/*
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
