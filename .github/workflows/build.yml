name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (core + typecheck)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Git identity for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: cargo test -p strand-core

      # The desktop shell still has to compile on every push; installers are only built for releases (below).
      # It embeds the built frontend, so build that first.
      - run: pnpm build

      - run: cargo check -p strand --locked

  build:
    name: Build (${{ matrix.name }})
    # Installers only for release tags (and when started by hand); pushes and pull requests stop at the test job
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            bundles: app,dmg
          - name: Windows x64
            os: windows-latest
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      - name: Build app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          # Update packages need the signing key; without the secret, build without them
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            pnpm tauri build --bundles ${{ matrix.bundles }}
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set; building without update packages"
            pnpm tauri build --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      - name: Collect files (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p out
          cp target/release/bundle/dmg/*.dmg out/
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          # Update package for the in-app updater
          if [ -f target/release/bundle/macos/Strand.app.tar.gz ]; then
            cp target/release/bundle/macos/Strand.app.tar.gz "out/Strand_${version}_aarch64.app.tar.gz"
            cp target/release/bundle/macos/Strand.app.tar.gz.sig "out/Strand_${version}_aarch64.app.tar.gz.sig"
          fi
          ls -la out

      - name: Collect files (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p out
          cp target/release/bundle/nsis/*.exe out/
          cp target/release/bundle/nsis/*.exe.sig out/ 2>/dev/null || true
          cp target/release/bundle/msi/*.msi out/
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cp target/release/strand.exe "out/Strand_${version}_x64_portable.exe"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: strand-${{ runner.os == 'macOS' && 'macos-arm64' || 'windows-x64' }}
          path: out/*
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release notes from commit titles since the previous tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          prev=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          range="${prev:+$prev..}$TAG"
          {
            echo "## What's changed"
            echo
            git log "$range" --no-merges --format='- %s' | grep -v -E '^- (Release [0-9]|Website( and manual)?: download links)' || true
            if [ -n "$prev" ]; then
              echo
              echo "Full list: https://github.com/${{ github.repository }}/compare/$prev...$TAG"
            fi
          } > release-notes.md
          cat release-notes.md

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Write latest.json for the in-app updater
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          node - <<'JS'
          const fs = require("fs");
          const tag = process.env.TAG, version = tag.replace(/^v/, "");
          const base = `https://github.com/${process.env.REPO}/releases/download/${tag}/`;
          const files = fs.readdirSync("artifacts");
          const platforms = {};
          const add = (key, re) => {
            const f = files.find((n) => re.test(n) && !n.endsWith(".sig"));
            if (f && files.includes(f + ".sig")) platforms[key] = { signature: fs.readFileSync(`artifacts/${f}.sig`, "utf8").trim(), url: base + f };
          };
          add("darwin-aarch64", /_aarch64\.app\.tar\.gz$/);
          add("windows-x86_64", /_x64-setup\.exe$/);
          if (!Object.keys(platforms).length) { console.log("No signed update packages; skipping latest.json"); process.exit(0); }
          // The in-app update card shows these notes; drop the heading and link
          const notes = fs.readFileSync("release-notes.md", "utf8").split("\n").filter((l) => l.startsWith("- ")).join("\n") || `Strand ${version}`;
          const json = { version, notes, pub_date: new Date().toISOString(), platforms };
          fs.writeFileSync("artifacts/latest.json", JSON.stringify(json, null, 2));
          console.log(JSON.stringify(json, null, 2));
          JS

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: release-notes.md
