<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>交互式变基</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button,select{font:inherit;color:inherit}
a{color:#1D1D1F}a:hover{color:#000000}
</style>
</helmet>
<div style="min-height: 900px; display: flex; flex-direction: column; background: #FFFFFF; color: #1D1D1F; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', sans-serif; font-size: 13px; line-height: 1.4">

<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 10px 16px; background: #F5F5F7; border-bottom: 1px solid #DCDCE0">
<div aria-hidden="true" style="display: flex; gap: 8px; margin-right: 8px">
<span style="width: 12px; height: 12px; border-radius: 50%; background: #FF5F57"></span>
<span style="width: 12px; height: 12px; border-radius: 50%; background: #FEBC2E"></span>
<span style="width: 12px; height: 12px; border-radius: 50%; background: #28C840"></span>
</div>
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 8px; text-decoration: none">
<svg aria-hidden="true" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="#1D1D1F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 1.5L3 5l3.5 3.5"></path></svg>
历史
</a>
<span style="font-weight: 600; font-size: 14px">整理提交</span>
<span style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border-radius: 15px; background: #FFFFFF; border: 1px solid #DCDCE0; font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 12px">feature/commit-graph <span style="color: #6E6E73">放到</span> main <span style="color: #6E6E73">之上</span></span>
<span style="margin-left: auto; color: #6E6E73">{{total}} 个提交 → {{resultCount}} 个提交</span>
</header>

<div style="display: flex; flex-wrap: wrap; flex-grow: 1">

<main style="flex: 999 1 560px; min-width: 0; padding: 20px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; padding: 0 4px 4px; font-size: 11px; font-weight: 600; color: #6E6E73"><span>从上到下依次应用（最上面是最早的提交）</span><span>拖动或用箭头调整顺序</span></div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; min-height: 52px; padding: 6px 12px; box-sizing: border-box; border: 1px solid #DCDCE0; border-radius: 10px; margin-left: {{r.indent}}; background: {{r.bg}}">
<div style="display: flex; flex-direction: column; gap: 2px">
<button type="button" onClick="{{r.up}}" aria-label="上移" style="display: flex; align-items: center; justify-content: center; width: 26px; height: 18px; padding: 0; border: 1px solid #C9C9CF; border-radius: 5px; background: #FFFFFF; cursor: pointer"><svg aria-hidden="true" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="#1D1D1F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.5l3-3 3 3"></path></svg></button>
<button type="button" onClick="{{r.down}}" aria-label="下移" style="display: flex; align-items: center; justify-content: center; width: 26px; height: 18px; padding: 0; border: 1px solid #C9C9CF; border-radius: 5px; background: #FFFFFF; cursor: pointer"><svg aria-hidden="true" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="#1D1D1F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3.5l3 3 3-3"></path></svg></button>
</div>
<select value="{{r.act}}" onChange="{{r.setAct}}" aria-label="对这个提交做什么" style="height: 30px; width: 132px; padding: 0 8px; border: 1px solid #C9C9CF; border-radius: 7px; background: #FFFFFF; font-weight: 600">
<option value="pick">保留</option>
<option value="reword">改说明</option>
<option value="squash">并入上一个</option>
<option value="fixup">并入，丢弃说明</option>
<option value="drop">丢弃</option>
</select>
<span style="font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: #6E6E73">{{r.id}}</span>
<span style="flex: 1 1 200px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-decoration: {{r.deco}}; color: {{r.fg}}">{{r.msg}}</span>
<span style="color: #6E6E73; white-space: nowrap">{{r.note}}</span>
</div>
</sc-for>

<div style="margin-top: 12px; padding: 12px 14px; border-radius: 10px; background: #F5F5F7; color: #4A4A4F">这些提交都还没有推送，改写它们不会影响别人。</div>
</main>

<aside aria-label="结果预览" style="flex: 1 1 360px; max-width: 100%; box-sizing: border-box; padding: 20px; background: #FAFAFB; border-left: 1px solid #E6E6EA; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; color: #6E6E73"><span>整理后的历史</span><span>最新的在上面</span></div>
<div style="display: flex; flex-direction: column">
<sc-for list="{{result}}" as="c" hint-placeholder-count="3">
<div style="display: flex; gap: 12px; min-height: 56px">
<div aria-hidden="true" style="display: flex; flex-direction: column; align-items: center; width: 12px">
<span style="width: 11px; height: 11px; margin-top: 4px; border-radius: 50%; background: #C2540A"></span>
<span style="flex-grow: 1; width: 2px; background: #C2540A"></span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px; padding-bottom: 12px; min-width: 0">
<span style="font-weight: 600">{{c.msg}}</span>
<span style="font-size: 12px; color: #6E6E73">{{c.note}}</span>
</div>
</div>
</sc-for>
<div style="display: flex; gap: 12px; align-items: center">
<span aria-hidden="true" style="width: 11px; height: 11px; border-radius: 50%; background: #0064E0; margin-left: 0.5px"></span>
<span style="padding: 1px 7px; border-radius: 5px; background: #E8F0FE; color: #0B4FB3; font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 11px">main</span>
<span style="color: #4A4A4F">合并分支 fix/diff-ime</span>
</div>
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
<span style="color: #4A4A4F">{{dropNote}}</span>
<div style="display: flex; gap: 8px">
<a href="Main.dc.html" style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; height: 34px; border: 1px solid #C9C9CF; border-radius: 8px; background: #FFFFFF; font-weight: 600; text-decoration: none">取消</a>
<a href="Conflict.dc.html" style="flex: 2 1 0; display: flex; align-items: center; justify-content: center; height: 34px; border-radius: 8px; color: #FFFFFF; font-weight: 600; text-decoration: none; background: {{accent}}">开始整理</a>
</div>
<span style="font-size: 12px; color: #6E6E73">完成后可以在操作时间线里一步撤销。</span>
</div>
</aside>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0064E0","options":["#0064E0","#7A3FD0","#B3401A","#0A6B74"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const base = {
'91d4c6f': '图谱：读取 commit-graph 文件加速首屏',
'd2e81b0': '修正拼写',
'7be0d15': '图谱：虚拟滚动支持 10 万条提交',
'4f6a9c3': '临时：调试输出',
'a41f9c2': '图谱：泳道计算移到后台线程'
};
const order = s.order || ['91d4c6f', 'd2e81b0', '7be0d15', '4f6a9c3', 'a41f9c2'];
const acts = s.acts || { 'd2e81b0': 'fixup', '4f6a9c3': 'drop' };
const move = (i, d) => () => {
const j = i + d;
if (j < 0 || j >= order.length) return;
const n = order.slice();
const t = n[i]; n[i] = n[j]; n[j] = t;
this.setState({ order: n });
};
const result = [];
let dropped = 0;
const rows = order.map((id, i) => {
let act = acts[id] || 'pick';
const merge = (act === 'squash' || act === 'fixup') && result.length > 0;
let note = '';
if (act === 'drop') { dropped += 1; note = '这个提交的改动会消失'; }
else if (merge) {
const last = result[result.length - 1];
last.count += 1;
if (act === 'squash') last.keep += 1;
note = act === 'squash' ? '说明会合并进去' : '只保留改动';
} else {
result.push({ msg: base[id], count: 1, keep: 1, reword: act === 'reword' });
note = act === 'reword' ? '开始后会让你改说明' : (act === 'pick' ? '' : '前面没有提交可并入，按保留处理');
}
return {
id: id, msg: base[id], act: act, note: note,
indent: merge ? '28px' : '0px',
bg: act === 'drop' ? '#FAFAFB' : '#FFFFFF',
fg: act === 'drop' ? '#6E6E73' : '#1D1D1F',
deco: act === 'drop' ? 'line-through' : 'none',
up: move(i, -1), down: move(i, 1),
setAct: (e) => { const n = Object.assign({}, acts); n[id] = e.target.value; this.setState({ acts: n }); }
};
});
const shown = result.slice().reverse().map((c) => ({
msg: c.msg,
note: (c.count > 1 ? '由 ' + c.count + ' 个提交合成' : '保持不变') + (c.reword ? '，说明待修改' : '')
}));
return {
accent: this.props.accent ?? '#0064E0',
rows: rows,
result: shown,
total: order.length,
resultCount: result.length,
dropNote: dropped > 0 ? '有 ' + dropped + ' 个提交会被丢弃，它的改动不会保留。' : '没有提交被丢弃。'
};
}
}
</script>
</body>
</html>
