<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>拉取遇到冲突的摘要面板</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{font:inherit;color:inherit}
a{color:#1D1D1F}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 600px; height: 620px; box-sizing: border-box; padding: 32px; background: #E9E9ED; color: #1D1D1F; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', sans-serif; font-size: 13px; line-height: 1.4; display: flex; flex-direction: column; gap: 16px">

<div style="align-self: center; display: flex; align-items: center; height: 30px; border-radius: 15px; background: #FFFFFF; border: 1px solid #DCDCE0; overflow: hidden">
<span style="display: flex; align-items: center; height: 30px; padding: 0 12px; font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 12px">feature/commit-graph</span>
<span style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-left: 1px solid #DCDCE0; background: #FFE9A8; color: #5C4300; font-weight: 600">拉取暂停 · 4 个文件冲突</span>
</div>

<div style="flex-grow: 1; box-sizing: border-box; border-radius: 14px; background: #FFFFFF; border: 1px solid #DCDCE0; box-shadow: 0 18px 48px rgba(0,0,0,0.18); overflow: hidden; display: flex; flex-direction: column">
<div style="padding: 18px 20px 12px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 17px; font-weight: 600">拉取完成了一部分，还有冲突要你决定</span>
<span style="color: #4A4A4F">从 <span style="font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 12px">origin/feature/commit-graph</span> 拉取 · 合并方式</span>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 0 20px 12px">
<div style="padding: 10px 12px; border-radius: 10px; background: #F5F5F7; display: flex; flex-direction: column"><span style="font-size: 20px; font-weight: 600">4</span><span style="color: #4A4A4F">个新提交</span></div>
<div style="padding: 10px 12px; border-radius: 10px; background: #E3F3E8; display: flex; flex-direction: column"><span style="font-size: 20px; font-weight: 600; color: #1A6B34">9</span><span style="color: #1A6B34">个文件已自动合并</span></div>
<div style="padding: 10px 12px; border-radius: 10px; background: #FFE9A8; display: flex; flex-direction: column"><span style="font-size: 20px; font-weight: 600; color: #5C4300">4</span><span style="color: #5C4300">个文件有冲突</span></div>
</div>

<div style="padding: 0 20px; display: flex; flex-direction: column">
<div style="padding: 6px 0; font-size: 11px; font-weight: 600; color: #6E6E73">有冲突的文件</div>
<div style="display: flex; align-items: center; gap: 8px; min-height: 34px; border-top: 1px solid #E6E6EA"><span style="flex-grow: 1; font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 12px">src/ui/graph_view.rs</span><span style="color: #4A4A4F">2 处</span></div>
<div style="display: flex; align-items: center; gap: 8px; min-height: 34px; border-top: 1px solid #E6E6EA"><span style="flex-grow: 1; font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 12px">src/graph/layout.rs</span><span style="color: #4A4A4F">1 处</span></div>
<div style="display: flex; align-items: center; gap: 8px; min-height: 34px; border-top: 1px solid #E6E6EA"><span style="flex-grow: 1; font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 12px">src/sync/log.rs</span><span style="color: #4A4A4F">你修改了，对方删除了</span></div>
<div style="display: flex; align-items: center; gap: 8px; min-height: 34px; border-top: 1px solid #E6E6EA"><span style="flex-grow: 1; font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 12px">Cargo.lock</span><span style="color: #4A4A4F">锁文件，建议用对方的</span></div>
</div>

<div style="margin: 12px 20px 0; padding: 10px 12px; border-radius: 10px; background: #F5F5F7; color: #4A4A4F">你还没提交的 3 个文件改动已放到暂存架，解决完会自动放回。</div>

<div style="margin-top: auto; display: flex; gap: 8px; padding: 16px 20px; border-top: 1px solid #E6E6EA; background: #FAFAFB">
<a href="Main.dc.html" style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; height: 44px; border: 1px solid #C9C9CF; border-radius: 9px; background: #FFFFFF; color: #B3261E; font-weight: 600; text-decoration: none">中止，回到拉取之前</a>
<a href="Conflict.dc.html" style="flex: 1.4 1 0; display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 9px; color: #FFFFFF; font-weight: 600; text-decoration: none; background: {{accent}}">开始解决</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0064E0","options":["#0064E0","#7A3FD0","#B3401A","#0A6B74"]},"$preview":{"width":600,"height":620}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#0064E0' };
}
}
</script>
</body>
</html>
