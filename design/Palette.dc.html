<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>命令面板（深色模式）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button,input{font:inherit;color:inherit}
</style>
</helmet>
<div style="min-height: 900px; display: flex; flex-direction: column; background: #1C1C1E; color: #F5F5F7; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', sans-serif; font-size: 13px; line-height: 1.4; position: relative">

<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 10px 16px; background: #2A2A2D; border-bottom: 1px solid #3A3A3D">
<div aria-hidden="true" style="display: flex; gap: 8px; margin-right: 8px">
<span style="width: 12px; height: 12px; border-radius: 50%; background: #FF5F57"></span>
<span style="width: 12px; height: 12px; border-radius: 50%; background: #FEBC2E"></span>
<span style="width: 12px; height: 12px; border-radius: 50%; background: #28C840"></span>
</div>
<span style="font-weight: 600">strand-app</span>
<span style="display: flex; align-items: center; height: 30px; padding: 0 12px; border-radius: 15px; border: 1px solid #48484C; font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 12px">feature/commit-graph</span>
<span style="margin-left: auto; color: #A1A1A6">历史</span>
</header>

<div style="display: flex; flex-wrap: wrap; flex-grow: 1">
<aside style="flex: 0 0 232px; box-sizing: border-box; padding: 12px 18px; background: #242426; border-right: 1px solid #3A3A3D; display: flex; flex-direction: column; gap: 10px; color: #A1A1A6">
<span style="font-size: 11px; font-weight: 600">本地分支</span>
<span style="font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 12px">main</span>
<span style="font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: #F5F5F7">feature/commit-graph</span>
<span style="font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 12px">fix/diff-ime</span>
</aside>
<main style="flex: 999 1 520px; min-width: 0; padding: 8px 16px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
<div style="display: flex; align-items: center; gap: 12px; height: 36px; border-bottom: 1px solid #2C2C2E">
<span aria-hidden="true" style="flex-shrink: 0; width: 9px; height: 9px; border-radius: 50%; background: {{r.dot}}"></span>
<span style="flex-grow: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.msg}}</span>
<span style="color: #A1A1A6; white-space: nowrap">{{r.time}}</span>
</div>
</sc-for>
</main>
</div>

<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.5)"></div>

<div role="dialog" aria-label="命令面板" style="position: absolute; top: 110px; left: 50%; transform: translateX(-50%); width: min(780px, calc(100% - 32px)); border-radius: 14px; background: #2C2C2E; border: 1px solid #4A4A4E; box-shadow: 0 24px 64px rgba(0,0,0,0.5); overflow: hidden">
<label style="display: flex; align-items: center; gap: 10px; padding: 0 16px; height: 54px; border-bottom: 1px solid #3F3F43">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#A1A1A6" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="5"></circle><path d="M11 11l3.5 3.5"></path></svg>
<input type="text" value="变基" readOnly="{{true}}" aria-label="搜索或输入命令" style="flex-grow: 1; min-width: 0; height: 40px; border: 0; outline: 0; background: transparent; font-size: 17px">
<span style="padding: 2px 6px; border-radius: 5px; border: 1px solid #5A5A5E; font-size: 11px; color: #C7C7CC">esc</span>
</label>

<div style="display: flex; flex-wrap: wrap">
<div style="flex: 1 1 400px; min-width: 0; padding: 8px; display: flex; flex-direction: column; gap: 2px">
<div style="padding: 6px 10px 4px; font-size: 11px; font-weight: 600; color: #A1A1A6">操作</div>
<button type="button" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 10px; border: 0; border-radius: 8px; text-align: left; cursor: pointer; background: {{accent}}; color: #FFFFFF">
<span style="flex-grow: 1">把当前分支变基到 main</span>
<span style="font-size: 12px">↵</span>
</button>
<button type="button" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; cursor: pointer">
<span style="flex-grow: 1">交互式变基：整理最近 2 个提交</span>
<span style="font-size: 12px; color: #A1A1A6">⌥⌘R</span>
</button>
<button type="button" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; cursor: pointer">
<span style="flex-grow: 1">拉取时使用变基</span>
<span style="font-size: 12px; color: #A1A1A6">设置</span>
</button>
<div style="padding: 10px 10px 4px; font-size: 11px; font-weight: 600; color: #A1A1A6">时间线</div>
<button type="button" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; cursor: pointer">
<span style="flex-grow: 1">回到“变基到 main”之前</span>
<span style="font-size: 12px; color: #A1A1A6">昨天</span>
</button>
<div style="padding: 10px 10px 4px; font-size: 11px; font-weight: 600; color: #A1A1A6">提交</div>
<button type="button" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; cursor: pointer">
<span style="font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: #A1A1A6">8c1d2e9</span>
<span style="flex-grow: 1">变基后修复编译错误</span>
</button>
</div>

<aside aria-label="影响预览" style="flex: 1 1 280px; box-sizing: border-box; padding: 16px; background: #252527; border-left: 1px solid #3F3F43; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 11px; font-weight: 600; color: #A1A1A6">执行前预览</span>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 8px"><span style="padding: 1px 7px; border-radius: 5px; background: #F5F5F7; color: #1C1C1E; font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 11px">feature/commit-graph</span></div>
<div style="padding-left: 10px; border-left: 2px solid #E08A4F; display: flex; flex-direction: column; gap: 6px">
<span>图谱：泳道计算移到后台线程</span>
<span>图谱：虚拟滚动支持 10 万条提交</span>
</div>
<div style="display: flex; align-items: center; gap: 8px; color: #A1A1A6">
<svg aria-hidden="true" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#A1A1A6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 1.5v9M2.5 7L6 10.5 9.5 7"></path></svg>
移到下面这个提交之上
</div>
<div style="display: flex; align-items: center; gap: 8px"><span style="padding: 1px 7px; border-radius: 5px; background: #1F3A66; color: #D6E6FF; font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 11px">main</span><span>合并分支 fix/diff-ime</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; padding-top: 12px; border-top: 1px solid #3F3F43; color: #C7C7CC">
<span>2 个提交会被改写</span>
<span>预计没有冲突</span>
<span>完成后可以在时间线里撤销</span>
</div>
</aside>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 16px; padding: 10px 16px; border-top: 1px solid #3F3F43; font-size: 12px; color: #A1A1A6">
<span>↑↓ 选择</span>
<span>↵ 执行</span>
<span>⌘↵ 只预览，不执行</span>
<span style="margin-left: auto">输入 &gt; 只搜操作，@ 搜分支，# 搜提交</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0064E0","options":["#0064E0","#7A3FD0","#B3401A","#0A6B74"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const o = '#E08A4F', b = '#5B9BFF', p = '#B48CF2';
const rows = [
[o, '图谱：泳道计算移到后台线程', '2 分钟前'],
[o, '图谱：虚拟滚动支持 10 万条提交', '40 分钟前'],
[b, '合并分支 fix/diff-ime', '1 小时前'],
[p, '修复：diff 视图中输入法候选框错位', '3 小时前'],
[o, '图谱：读取 commit-graph 文件加速首屏', '昨天'],
[p, '修复：行级暂存丢失换行符', '昨天'],
[b, '发布 0.4.0', '3 天前'],
[b, '侧边栏：仓库分组与搜索', '4 天前'],
[b, '状态监听改为增量刷新', '5 天前'],
[b, '暂存架：支持命名和预览', '6 天前']
].map((r) => ({ dot: r[0], msg: r[1], time: r[2] }));
return { accent: this.props.accent ?? '#0064E0', rows: rows };
}
}
</script>
</body>
</html>
