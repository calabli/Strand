<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>拖拽分支进行合并或变基</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 760px; height: 520px; box-sizing: border-box; position: relative; background: #E9E9ED; color: #1D1D1F; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', sans-serif; font-size: 13px; line-height: 1.4; overflow: hidden">

<div style="position: absolute; left: 36px; top: 36px; width: 250px; height: 448px; box-sizing: border-box; padding: 14px 10px; border-radius: 12px; background: #F5F5F7; border: 1px solid #DCDCE0; display: flex; flex-direction: column; gap: 4px">
<div style="padding: 0 8px 4px; font-size: 11px; font-weight: 600; color: #6E6E73">本地分支</div>
<div style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: 7px; background: #FFFFFF; box-shadow: 0 0 0 2px {{accent}}; font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 12px; font-weight: 600"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #0064E0"></span>main<span style="margin-left: auto; font-family: -apple-system, 'PingFang SC', sans-serif; font-size: 11px; color: {{accent}}">放到这里</span></div>
<div style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: 7px; border: 1px dashed #A9A9B0; box-sizing: border-box; font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: #6E6E73"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #C2540A"></span>feature/commit-graph</div>
<div style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: 7px; font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 12px"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #7A3FD0"></span>fix/diff-ime</div>
<div style="padding: 14px 8px 4px; font-size: 11px; font-weight: 600; color: #6E6E73">远程 · origin</div>
<div style="display: flex; align-items: center; height: 32px; padding: 0 8px 0 24px; font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 12px">main</div>
<div style="display: flex; align-items: center; height: 32px; padding: 0 8px 0 24px; font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 12px">feature/commit-graph</div>
<div style="margin-top: auto; padding: 10px; border-radius: 10px; background: #FFFFFF; border: 1px solid #DCDCE0; color: #6E6E73; font-size: 12px">拖到远程分支上是推送；拖到提交上是把分支指到那个提交。</div>
</div>

<div style="position: absolute; left: 150px; top: 76px; display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border-radius: 15px; background: #1D1D1F; color: #FFFFFF; font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 12px; box-shadow: 0 10px 24px rgba(0,0,0,0.28); transform: rotate(-3deg)"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #F0A36B"></span>feature/commit-graph</div>
<svg aria-hidden="true" width="18" height="22" viewBox="0 0 18 22" style="position: absolute; left: 172px; top: 98px"><path d="M2 2v15l4-3.5 2.6 6 2.6-1.1-2.6-5.9H14z" fill="#1D1D1F" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"></path></svg>

<div style="position: absolute; left: 322px; top: 56px; width: 402px; box-sizing: border-box; border-radius: 14px; background: #FFFFFF; border: 1px solid #DCDCE0; box-shadow: 0 18px 48px rgba(0,0,0,0.18); overflow: hidden">
<div style="padding: 14px 16px 10px; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 600">把分支放到 main 上</span>
<span style="color: #6E6E73">feature/commit-graph 比 main 多 2 个提交</span>
</div>
<div style="padding: 0 8px 8px; display: flex; flex-direction: column; gap: 2px">
<button type="button" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 10px; border: 0; border-radius: 9px; text-align: left; cursor: pointer; background: {{accent}}; color: #FFFFFF">
<span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-weight: 600">合并到 main</span><span style="font-size: 12px">保留两条线，生成一个合并提交</span></span>
<span style="font-size: 12px">↵</span>
</button>
<button type="button" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 10px; border: 0; border-radius: 9px; background: transparent; text-align: left; cursor: pointer">
<span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-weight: 600">变基到 main 之上</span><span style="font-size: 12px; color: #6E6E73">历史变成一条直线，提交会被改写</span></span>
<span style="font-size: 12px; color: #6E6E73">R</span>
</button>
<button type="button" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 10px; border: 0; border-radius: 9px; background: transparent; text-align: left; cursor: pointer">
<span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-weight: 600">压缩成 1 个提交再合并</span><span style="font-size: 12px; color: #6E6E73">2 个提交合成一个</span></span>
<span style="font-size: 12px; color: #6E6E73">S</span>
</button>
<button type="button" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 10px; border: 0; border-radius: 9px; background: transparent; text-align: left; cursor: pointer">
<span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-weight: 600">创建合并请求…</span><span style="font-size: 12px; color: #6E6E73">先推送，再到托管平台上发起</span></span>
<span style="font-size: 12px; color: #6E6E73">P</span>
</button>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 14px; padding: 10px 16px; border-top: 1px solid #E6E6EA; background: #FAFAFB; font-size: 12px; color: #4A4A4F">
<span>预计没有冲突</span>
<span>3 个文件会变化</span>
<span style="margin-left: auto">完成后可撤销</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0064E0","options":["#0064E0","#7A3FD0","#B3401A","#0A6B74"]},"$preview":{"width":760,"height":520}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#0064E0' };
}
}
</script>
</body>
</html>
