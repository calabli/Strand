[workspace]
resolver = "3"
members = ["src-tauri", "crates/strand-core"]

[workspace.package]
version = "0.1.5"
edition = "2024"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Optimize dependencies in dev builds too; otherwise gix is very slow walking large repositories
[profile.dev.package."*"]
opt-level = 2

# Optimize the core crate in dev builds too: unoptimized graph and sort loops run 10x slower, so dev timings would be meaningless
[profile.dev.package.strand-core]
opt-level = 2

# Release bundle size optimizations, see https://tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
