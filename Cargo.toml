[workspace]
resolver = "3"
members = ["src-tauri", "crates/strand-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# 依赖在开发时也开优化，否则 gix 遍历大仓库会很慢
[profile.dev.package."*"]
opt-level = 2

# 核心层在开发时也开优化：图谱、排序这些循环不优化时慢 10 倍，开发时测不出真实速度
[profile.dev.package.strand-core]
opt-level = 2

# 发布包体积优化，见 https://tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
