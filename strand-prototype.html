        if (tgt !== b.head) { S.amend = false; S.amendTo = ''; act.cfix(tgt); return true; }
        var h = commitById(b.head);
        if (!h.unpushed) { toast('上一次提交已经推送，不能修订'); return; }
        d = snap('修订 ' + h.id);
        files.forEach(function (f) { h.files = h.files.filter(function (x) { return x.path !== f.path; }); h.files.push(f); });
        if (title) { h.msg = title; h.desc = desc; }
        id = h.id; S.selected = id;
        S.timeline.unshift({ label: '修订 ' + id, time: '刚刚', depth: d });
      } else {
        if (!title) { toast('先写一句提交说明'); var m = $('msg'); if (m) m.focus(); return; }
        if (S.copt.sign) desc = (desc ? desc + ' ' : '') + 'Signed-off-by: 林夏';
        if (S.copt.fmt) git('# 提交前：格式化代码');
        if (S.copt.check) git('# 提交前：运行检查，通过');
        S.msgHist = [S.msg].concat(S.msgHist.filter(function (x) { return x !== S.msg; })).slice(0, 10);
        d = snap('提交“' + title + '”');
        id = addCommit({ msg: title, desc: desc, files: files, src: JSON.parse(JSON.stringify(picked)) }).id;
        S.timeline.unshift({ label: '提交 ' + id, time: '刚刚', depth: d });
      }
      S.changes = S.changes.filter(function (f) { return S.offFiles[f.path]; });
      S.offFiles = {}; S.cfile = 0; S.msg = ''; S.amend = false;
      S.view = 'main'; S.tab = 'log'; render();
      toast((d !== undefined && S.timeline[0].label.indexOf('修订') === 0 ? '已修订上一次提交，加入 ' : '已提交 ') + picked.length + ' 个文件', true);
      return true;
    },

    /* 冲突 */
    cfOpen: function (i) { if (CF[+i].card) return; S.cf.open = +i; S.cf.file = +i; S.cf.cur = 0; S.cf.checked = false; pendingScroll = 0; render(); },
    cfGo: function (gi) { cfGoto(+gi); },
    cfStep: function (d) {
      var f = CF[S.cf.file], n = f.ids.length;
      cfGoto(gIndex(f.ids[(Math.min(S.cf.cur, n - 1) + (+d) + n) % n]));
    },
    cfPick: function (arg) {
      var a = arg.split('|'), id = a[0], here = gIndex(id);
      snap(a[1] === 'card' ? '第 ' + (here + 1) + ' 处的选择' : (a[2] === 'a' ? '接受' : '舍弃') + (a[1] === 'm' ? '你的' : '对方的') + '修改块（第 ' + (here + 1) + ' 处）');
      var c = S.cf.choice[id] || {};
      if (a[1] === 'card') c = a[2] === 'mine' ? { m: 'a', t: 'x' } : { m: 'x', t: 'a' };
      else c[a[1]] = a[2];
      S.cf.choice[id] = c; S.cf.file = G[here].file; S.cf.cur = G[here].idx;
      cfAfterMark(id);
    },
    cfWhole: function (v) {
      snap('整个文件都接受' + (v === 'mine' ? '你的' : '对方的'));
      CF[S.cf.file].ids.forEach(function (id) {
        var s = sidesOf(id), c = {};
        if (s.m) c.m = v === 'mine' ? 'a' : 'x';
        if (s.t) c.t = v === 'theirs' ? 'a' : 'x';
        S.cf.choice[id] = c;
      });
      if (!cfUnmarked()) S.cf.checked = false;
      render();
    },
    cfAuto: function () {
      var todo = G.filter(function (g) { var s = sidesOf(g.id); return s.m !== s.t && !isDone(g.id); });
      if (!todo.length) { toast('没有需要处理的无冲突修改块'); return; }
      snap('接受所有没有冲突的修改块');
      todo.forEach(function (g) { var s = sidesOf(g.id); S.cf.choice[g.id] = s.m ? { m: 'a' } : { t: 'a' }; });
      if (!cfUnmarked()) S.cf.checked = false;
      render(); toast('已接受 ' + todo.length + ' 个没有冲突的修改块', true);
    },
    cfEdit: function (id) {
      var g = SEG[id], v = S.cf.choice[id] || {}, cur = resultOf(g, v);
      if (!cur.length) cur = g.base;
      ask({ kind: 'edit', title: '手动编辑第 ' + (gIndex(id) + 1) + ' 处的结果', text: '保存后，这一处的修改块都算已处理，结果用你写的内容。', value: cur.join('\n'), run: 'cfEditDo', arg: id });
    },
    cfEditDo: function (id, val) {
      var here = gIndex(id), s = sidesOf(id), c = { custom: (val || '').replace(/\s+$/, '').split('\n') };
      snap('手动编辑第 ' + (here + 1) + ' 处');
      if (s.m) c.m = 'x'; if (s.t) c.t = 'x';
      S.cf.choice[id] = c; S.cf.file = G[here].file; S.cf.cur = G[here].idx;
      cfAfterMark(id);
    },
    cfAbort: function () { undoTo(S.cf.depth, '已中止拉取，回到了拉取之前'); },
    cfFinish: function () {
      var left = S.cf.skip ? 0 : cfUnmarked();
      if (left) {
        S.cf.checked = true;
        for (var u = 0; u < G.length; u++) if (!isDone(G[u].id)) { cfGoto(u); break; }
        toast('还有 ' + left + ' 个修改块没有标记，每个都要选接受或舍弃');
        return;
      }
      var b = B(), rb = !!S.cf.rebase, chain = rb ? localChain() : [], olds = chain.map(commitById), at = 0, n = 0, skipped = !!S.cf.skip;
      if (rb) S.commits = S.commits.filter(function (c) { return chain.indexOf(c.id) < 0; });
      for (var i = 0; i < S.commits.length; i++) if (S.commits[i].id === '7be0d15') at = i;
      var rl = rb ? b.lane : 3;
      S.commits.splice(at, 0,
        { id: '9d3e5b2', msg: '图谱：调整行高和预加载行数', desc: '行高改为 32，并在可视区域外多渲染 8 行。', author: '周屿', time: '20 分钟前', lane: rl, parents: ['6ab41c7'], files: [F('src/ui/graph_view.rs', 'M', 3, 1), F('src/sync/log.rs', 'D', 0, 96), F('Cargo.lock', 'M', 12, 9)] },
        { id: '6ab41c7', msg: '图谱：按范围取行', desc: '新增 rows_in，范围超出时自动截断。', author: '周屿', time: '1 小时前', lane: rl, parents: ['7be0d15'], files: [F('src/graph/layout.rs', 'M', 4, 1), F('src/ui/graph_view.rs', 'M', 1, 1)] });
      if (rb) {
        var parent = '9d3e5b2';
        olds.forEach(function (c, k) {
          if (skipped && k === 0) return;
          var o = { id: newId(), msg: c.msg, desc: c.desc, author: c.author, time: c.time, lane: b.lane, parents: [parent], unpushed: true, files: c.files };
          S.commits.unshift(o); parent = o.id; n++;
        });
        b.head = parent; b.ahead = n; S.selected = parent;
      } else {
        var head = b.head;
        addCommit({ msg: '合并 origin/' + S.branch, desc: '处理了 ' + G.length + ' 处修改，涉及 ' + CF.length + ' 个文件。', parents: [head, '9d3e5b2'], files: CF.map(function (f) { return F(f.path, 'M', f.ids.length, 0); }) });
      }
      var rmt = remoteOf(b.name); if (rmt) rmt.head = '9d3e5b2';
      b.behind = 0; S.merging = false;
      stack.length = S.cf.depth + 1;
      S.timeline.unshift({ label: rb ? '拉取并变基' : '拉取并合并', time: '刚刚', depth: S.cf.depth });
      S.view = 'main'; S.tab = 'log'; render();
      toast(rb ? '变基完成：拉取了 2 个提交，你的 ' + n + ' 个提交接在它们后面' + (skipped ? '，跳过了 1 个' : '') : '合并完成，拉取了 2 个提交', true);
    }
  };

  /* ---------- 渲染和事件 ---------- */
  function render() {
    var old = $('cf-scroll'), keep = old ? old.scrollTop : null;
    var ae = document.activeElement, fid = ae && (ae.id === 'hq' || ae.id === 'hp' || ae.id === 'tq') ? ae.id : null;
    ctxClose();
    $('app').innerHTML = toolbar() + (S.view === 'conflict' && S.merging ? conflictView() : mainView());
    $('overlay').innerHTML = S.sheet ? sheetView() : S.modal ? modalView() : '';
    var sc = $('cf-scroll');
    if (sc) {
      if (keep !== null) sc.scrollTop = keep;
      if (pendingScroll !== null) {
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (sc.scrollTo && !reduce) sc.scrollTo({ top: pendingScroll, behavior: 'smooth' }); else sc.scrollTop = pendingScroll;
      }
    }
    pendingScroll = null;
    if (pendingSel) { var ps = $(pendingSel); if (ps && ps.scrollIntoView) ps.scrollIntoView({ block: 'nearest' }); pendingSel = null; }
    if (fid) { var el = $(fid); if (el) { el.focus(); try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) {} } }
  }
  document.addEventListener('click', function (e) {
    if (ctxOpen && !(e.target.closest && e.target.closest('.menu'))) { ctxClose(); }
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (el) { if (el.disabled) return; var fn = act[el.getAttribute('data-act')]; if (fn) fn(el.getAttribute('data-arg'), e); return; }
    if (e.target.id === 'pal') palClose();
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'msg') { S.msg = e.target.value; var c = $('msg-count'); if (c) c.textContent = '标题 ' + S.msg.split('\n')[0].length + ' / 50'; }
    if (e.target.id === 'pal-in') { pal.q = e.target.value; pal.i = 0; palList(); }
    if (e.target.id === 'hq') { S.hq = e.target.value; render(); }
    if (e.target.id === 'hp') { S.hpath = e.target.value; render(); }
    if (e.target.id === 'tq') { S.tq = e.target.value; render(); }
  });
  document.addEventListener('change', function (e) {
    var id = e.target.id;
    if (id === 'ha' || id === 'hb' || id === 'hd') { S[id] = e.target.value; render(); }
    if (id === 'amendto') { S.amendTo = e.target.value; }
  });
  document.addEventListener('contextmenu', function (e) {
    var el = e.target.closest ? e.target.closest('[data-ctx]') : null;
    if (!el) { ctxClose(); return; }
    e.preventDefault();
    var kind = el.getAttribute('data-ctx'), id = el.getAttribute('data-id');
    if (kind === 'commit' && S.selected !== id) { S.selected = id; render(); }
    ctxShow(e.clientX, e.clientY, ctxItems(kind, id));
  });
  document.addEventListener('dblclick', function (e) {
    var el = e.target.closest ? e.target.closest('[data-branch]') : null;
    if (el && el.getAttribute('data-branch') !== S.branch) act.bswitch(el.getAttribute('data-branch'));
  });
  document.addEventListener('dragstart', function (e) {
    var el = e.target.closest ? e.target.closest('[data-branch]') : null;
    if (!el) return;
    dragName = el.getAttribute('data-branch');
    try { e.dataTransfer.setData('text/plain', dragName); e.dataTransfer.effectAllowed = 'move'; } catch (err) {}
  });
  document.addEventListener('dragover', function (e) {
    var el = e.target.closest ? e.target.closest('[data-branch]') : null;
    if (el && dragName && el.getAttribute('data-branch') !== dragName) { e.preventDefault(); el.classList.add('over'); }
  });
  document.addEventListener('dragleave', function (e) {
    var el = e.target.closest ? e.target.closest('[data-branch]') : null;
    if (el) el.classList.remove('over');
  });
  document.addEventListener('drop', function (e) {
    var el = e.target.closest ? e.target.closest('[data-branch]') : null;
    if (el && dragName) { e.preventDefault(); var src = dragName; dragName = null; act.bdrop(src + '|' + el.getAttribute('data-branch')); }
  });
  document.addEventListener('dragend', function () { dragName = null; });
  document.addEventListener('keydown', function (e) {
    if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); if (pal.open) palClose(); else palOpen(); return; }
    if (ctxOpen && e.key === 'Escape') { ctxClose(); return; }
    if (pal.open) {
      if (e.key === 'Escape') { palClose(); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); pal.i = Math.min(pal.i + 1, pal.list.length - 1); palList(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); pal.i = Math.max(pal.i - 1, 0); palList(); }
      else if (e.key === 'Enter') { e.preventDefault(); act.palRun(pal.i); }
      return;
    }
    if (S.modal) {
      if (e.key === 'Escape') { act.modalCancel(); }
      else if (e.key === 'Enter' && (S.modal.kind === 'prompt' || S.modal.kind === 'confirm' || e.metaKey || e.ctrlKey)) { e.preventDefault(); act.modalOk(); }
      return;
    }
    if (S.sheet && e.key === 'Escape') { act.sheetAbort(); return; }
    if (S.view === 'conflict' && S.merging && S.cf.open != null && e.altKey && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { e.preventDefault(); act.cfStep(e.key === 'ArrowDown' ? '1' : '-1'); return; }
    if (S.view !== 'conflict' && (e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); act.commit(); return; }
    var tn = e.target && e.target.tagName ? e.target.tagName.toLowerCase() : '';
    if (S.view === 'conflict' || S.sheet || tn === 'input' || tn === 'textarea' || tn === 'select' || S.tab !== 'log') return;
    if (e.key === 'F2') { var cp = caps(S.selected); if (cp.canMsg) { e.preventDefault(); act.cmsg(S.selected); } }
    else if (e.key === 'ArrowRight') { e.preventDefault(); act.goParent(S.selected); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); act.goChild(S.selected); }
  });
  render();
})();
</script>
